name: ETL Sheets

on:
  schedule:
    # a cada 10 minutos, 24 horas por dia (o GitHub pode atrasar alguns minutos)
    - cron: "*/10 * * * *"
  workflow_dispatch:

# se uma execucao atrasar e a proxima comecar antes dela terminar, cancela a antiga
# (evita duas execucoes gravando na aba etl ao mesmo tempo)
concurrency:
  group: etl-sheets
  cancel-in-progress: true

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Executar ETL
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: python sheets_conexao.py
