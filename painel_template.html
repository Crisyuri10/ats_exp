// historico = D-1: so dias de expedicao ate ontem (hoje e os proximos dias ainda estao em andamento)
const filtrarHistorico = rows => rows.filter(r => r[I.dia] < hoje);

// ===== historico: como fecharam os tempos medios de cada etapa de transporte =====
// diferente do tempo real (so TUs paradas no status), aqui entram TODAS as TUs que ja concluiram a etapa.
// expandir a etapa: "Histórico por data" mostra as datas de expedicao; "por transportadora", as transportadoras
const histAbertos = new Set();  // etapas abertas (k), compartilhadas entre os dois historicos
const ehHist = () => modo.startsWith("hist");
function renderTabelaHistorico(rows) {
  // dia de hoje ou futuro escolhido no filtro: o historico so tem dias fechados (ate ontem)
  if (selDia.value && selDia.value >= hoje) {
    $("tab-status").innerHTML = `<tr><td class="muted" style="text-align:left;padding:16px 8px">` +
      `O histórico considera só dias até ontem (D-1). Escolha um dia anterior ou "Todos" no filtro.</td></tr>`;
    return;
  }
  const etapas = ETAPAS_HIST;
  // resumo de um grupo de TUs na etapa e: tempo medio e pedidos com tempo, e os pedidos sem tempo
  // separados pelo motivo (falta data / datas fora de ordem ou apos o checkout)
  const somaPed = rs => rs.reduce((a, r) => a + (r[I.pedidos] || 0), 0);
  const resumo = (rs, e) => {
    const com = rs.filter(r => e.val(r) != null);
    const motivo = c => rs.filter(r => e.val(r) == null && String(r[I.motivo] || "")[e.p] === c);
    return { com, tempo: media(com.map(e.val)), ped: somaPed(com), tus: com.length,
      falta: somaPed(motivo("1")), invalida: somaPed(motivo("2")) };
  };
  const agrupar = (rs, campo) => {
    const g = {};
    rs.forEach(r => (g[r[campo]] = g[r[campo]] || []).push(r));
    return g;
  };
  // pedidos sem tempo em vermelho (zero aparece como traco); com tempo + falta data + datas invalidas = total.
  // o numero e clicavel: abre o popup com as TUs e as colunas divergentes (fontesPopup guarda o grupo de cada celula)
  fontesPopup.length = 0;
  const gap = (n, rs, e, c, rotulo) => {
    if (!n) return `<td class="muted">—</td>`;
    fontesPopup.push({ rs, e, c, rotulo });
    return `<td class="gap"><button class="link-gap" data-f="${fontesPopup.length - 1}" title="ver as TUs">${fmtInt(n)}</button></td>`;
  };
  // linha da etapa com o total de pedidos em negrito (como a coluna Total do tempo real); detalhes sem negrito
  // e.extra (AG. VEÍCULO): resumo de antes/depois da janela embaixo do descritivo, so na linha da etapa
  // barra embaixo do tempo: proporcional ao Total (soma das etapas), que fica com a barra cheia; assim cada etapa
  // mostra o peso dela no tempo total do transporte. A etapa mais demorada fica em cor mais forte.
  // a chegada do veiculo x janela (AG. VEÍCULO) nao tem barra: mede folga/atraso, nao duracao de etapa
  const tempos = etapas.filter(e => !e.semSoma).map(e => resumo(rows, e).tempo || 0);
  const maxTempo = Math.max(...tempos), totTempo = Math.max(1, tempos.reduce((a, t) => a + t, 0));
  // AG. VEÍCULO (semSoma): barra verde (folga) ou vermelha (atraso), pelo valor absoluto na mesma escala
  const barraSinalH = (t, escala) => t == null || !t || !escala ? "" :
    `<div class="barra-tempo"><i class="${t >= 0 ? "folga" : "atraso"}" style="width:${Math.min(100, (Math.abs(t) / escala) * 100)}%"></i></div>`;
  const barraTempo = (t, e, total = false) => !total && e && e.semSoma ? barraSinalH(t, totTempo) :
    (!total && !e) || !(t > 0) ? "" :
    `<div class="barra-tempo"><i class="${total ? "total" : t === maxTempo ? "pico" : ""}" style="width:${Math.min(100, (t / totTempo) * 100)}%"></i></div>`;
  // nas datas/transportadoras abertas (escala = maior tempo do grupo aberto): a mais demorada fica cheia
  const barraDetalhe = (t, e, escala) => e && e.semSoma ? barraSinalH(t, escala) : !escala || !e || !(t > 0) ? "" :
    `<div class="barra-tempo"><i class="${t === escala ? "pico" : ""}" style="width:${(t / escala) * 100}%"></i></div>`;
  const celulas = (x, desc = "", negrito = false, rs = [], e = null, rotulo = "", escala = 0) =>
    `<td class="ini tempo">${fmtHms(x.tempo)}${negrito ? barraTempo(x.tempo, e) : barraDetalhe(x.tempo, e, escala)}</td>` +
    `<td class="etapa-desc">${desc}${e && e.extra ? e.extra(rs, negrito) : ""}</td>` +
    `<td class="ini ${negrito ? "tot" : ""}">${fmtInt(x.ped)}</td>` + gap(x.falta, rs, e, "1", rotulo) + gap(x.invalida, rs, e, "2", rotulo);
  const seta = (pode, aberto) => `<span class="seta">${pode ? (aberto ? "▾" : "▸") : ""}</span>`;

  let corpo = "";
  etapas.forEach(e => {
    const x = resumo(rows, e), aberto = histAbertos.has(e.chave), pode = rows.length > 0, st = STATUS[idxStatus(e.s)];
    corpo += `<tr class="${pode ? "expansivel" : ""}" data-a="${e.chave}"><td>${seta(pode, aberto)}` +
      `<span class="chip" style="background:${st.cor};color:${st.txt}">${e.s}</span></td>` +
      celulas(x, `<div>${e.nome}${e.desc ? `<br><span class="muted">${e.desc}</span>` : ""}</div>`, true, rows, e, "todas as datas") + `</tr>`;
    if (!aberto || !pode) return;
    if (modo === "hist-dia") {
      // por data: uma linha por data de expedicao, da mais recente para a mais antiga
      // (todas as TUs do recorte, para as datas com pedidos sem tempo tambem aparecerem)
      const porDia = agrupar(rows, I.dia);
      const dias = Object.keys(porDia).sort().reverse().map(d => ({ d, x: resumo(porDia[d], e) }));
      const escala = Math.max(0, ...dias.map(o => Math.abs(o.x.tempo || 0)));
      dias.forEach(({ d, x: xd }) => {
        const rotulo = `${d.slice(8, 10)}/${d.slice(5, 7)}/${d.slice(0, 4)}`;
        corpo += `<tr class="detalhe"><td>${rotulo}</td>${celulas(xd, "", false, porDia[d], e, rotulo, escala)}</tr>`;
      });
    } else {
      // por transportadora: todas as datas do recorte juntas, da transportadora com mais pedidos para a com menos
      const trs = Object.entries(agrupar(rows, I.tr))
        .map(([tr, rs]) => ({ tr, rs, x: resumo(rs, e) }))
        .sort((a, b) => (b.x.ped + b.x.falta + b.x.invalida) - (a.x.ped + a.x.falta + a.x.invalida));
      const escala = Math.max(0, ...trs.map(o => Math.abs(o.x.tempo || 0)));
      trs.forEach(({ tr, rs, x: xt }) => { corpo += `<tr class="detalhe"><td>${tr}</td>${celulas(xt, "", false, rs, e, tr, escala)}</tr>`; });
    }
  });

  // total: tempo = soma dos tempos medios das etapas do processo (da puxada ao checkout); a chegada do
  // veiculo x janela (AG. VEÍCULO) nao entra na soma, porque mede pontualidade e nao uma etapa do processo.
  // pedidos = todos os pedidos do recorte (cada TU contada uma vez, mesmo passando por varias etapas)
  const somaTempo = etapas.filter(e => !e.semSoma).reduce((a, e) => a + (resumo(rows, e).tempo || 0), 0);
  // total das colunas de falta data / datas invalidas = soma das etapas (o mesmo pedido pode contar em mais de uma)
  const totGap = campo => etapas.reduce((a, e) => a + resumo(rows, e)[campo], 0);
  const celTotGap = n => `<td class="gap" title="soma das etapas: o mesmo pedido pode contar em mais de uma">${n ? fmtInt(n) : "—"}</td>`;
  const totPed = somaPed(rows);
  $("tab-status").innerHTML =
    `<tr><th rowspan="2">Status TU</th><th class="grp" colspan="2">Tempo médio da etapa</th><th class="grp" colspan="3">Pedidos</th></tr>` +
    `<tr class="sub"><th class="ini">Tempo</th><th style="text-align:left">Etapa (cálculo)</th>` +
    `<th class="ini">Com tempo</th><th title="uma das datas da etapa não foi apontada">Falta data</th>` +
    `<th title="datas fora de ordem ou depois do checkout: tempo descartado">Datas inválidas</th></tr>` + corpo +
    `<tr class="total"><td>Total</td><td class="ini tempo">${fmtHms(rows.length ? somaTempo : null)}${rows.length ? barraTempo(somaTempo, null, true) : ""}</td>` +
    `<td class="etapa-desc"><div><span class="muted">soma dos tempos médios das etapas</span></div></td>` +
    `<td class="ini">${fmtInt(totPed)}</td>${celTotGap(totGap("falta"))}${celTotGap(totGap("invalida"))}</tr>`;
  $("tab-status").querySelectorAll("tr.expansivel").forEach(tr => tr.onclick = () => {
    const a = tr.dataset.a;
    histAbertos.has(a) ? histAbertos.delete(a) : histAbertos.add(a);
    salvarEstado();
    renderTabelaHistorico(filtrarHistorico(filtrar()));
  });
  // clique no numero de falta data / datas invalidas: abre o popup (sem expandir/recolher a linha)
  $("tab-status").querySelectorAll(".link-gap").forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    abrirPopup(fontesPopup[+b.dataset.f], ev);
  });
}

// ===== matriz: status vivo das carretas por hora (dia escolhido no filtro) =====
// cada carreta (chave, igual ao ATS) entra UMA vez: na linha do status atual (o da TU menos avancada) e
// na hora do ultimo apontamento do processo (quando entrou nesse status). Total da coluna = carretas que
// estao naquele status agora; a soma das colunas = carretas do dia.
// colunas = horas fixas (22h da vespera ate 21h); fora disso, "Antes 22h" (vespera) / "Depois 22h";
// sem nenhum apontamento de transporte (ainda na DHL) = "Sem registro"
const PONTOS_CONSOL = [0, 1, 2, 3, 4, 5, 6, 7];  // I.datas: fim fat., ATS, NF, fim consol., chegada doca, inicio carreg., fim carreg., checkout
const NOMES_PONTO = ["fim do faturamento", "ATS (puxada)", "entrada NF", "fim da consolidação", "chegada na doca", "início do carregamento", "fim do carregamento", "checkout"];
// horas na ordem do turno: comeca as 22h da vespera (22, 23, 00 ... 21)
const HORAS_CONSOL = [22, 23, ...Array(22).keys()].map(h => String(h).padStart(2, "0"));
const consolAbertas = new Set();  // horas expandidas (mostrando as transportadoras)
function renderMatrizConsolidacao(rows) {
  const dia = selDia.value || hoje;
  $("tit-consol").textContent = `Status atual das carretas por hora · expedição ${fmtDia(dia)}`;
  const car = {};
  rows.filter(r => r[I.dia] === dia).forEach(r => {
    const c = car[r[I.chave]] = car[r[I.chave]] || { tr: r[I.tr], st: 99, ultimo: "", ponto: -1 };
    c.st = Math.min(c.st, idxStatus(r[I.status]));
    const ds = r[I.datas] || [];
    PONTOS_CONSOL.forEach(pt => { if ((ds[pt] || "") > c.ultimo) { c.ultimo = ds[pt]; c.ponto = pt; } });
  });
  const lista = Object.values(car);
  // colunas: so os status em que ha carreta agora, na ordem do processo
  const colunas = STATUS.map((st, i) => ({ st, i })).filter(x => lista.some(c => c.st === x.i));
  // apontamento mais comum de cada coluna (mostrado embaixo do status: "desde ...")
  const desde = colunas.map(x => {
    const n = {};
    lista.filter(c => c.st === x.i && c.ponto >= 0).forEach(c => { n[c.ponto] = (n[c.ponto] || 0) + 1; });
    const pt = Object.keys(n).sort((u, v) => n[v] - n[u])[0];
    return pt != null ? "desde " + NOMES_PONTO[pt] : "";
  });
  const [a, m, d] = dia.split("-").map(Number);
  const ini = new Date(a, m - 1, d - 1, 22), fimJanela = new Date(a, m - 1, d, 22);
  const horaDe = c => {
    const s = c.ultimo;
    if (!s) return "sem";
    const t = new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10), +s.slice(11, 13), +s.slice(14, 16));
    if (t < ini) return "antes";
    if (t >= fimJanela) return "depois";
    return s.slice(11, 13);
  };
  // colunas = horas (22h da vespera ate 21h); "Antes 22h", "Depois 22h" e "Sem registro" so quando tem carreta
  const ROTULO_HORA = { antes: "Antes 22h", depois: "Depois 22h", sem: "Sem registro" };
  const horas = ["antes"].concat(HORAS_CONSOL, ["depois", "sem"])
    .filter(h => !ROTULO_HORA[h] || lista.some(c => horaDe(c) === h));
  // alerta: 4 carretas ou mais no mesmo status e na mesma hora ficam em vermelho (nao vale para a linha Total)
  const LIMITE_ALERTA = 4;
  const celula = (n, alerta) => !n ? `<td class="vazio">·</td>` : `<td class="${alerta && n >= LIMITE_ALERTA ? "alerta-qtd" : ""}">${fmtInt(n)}</td>`;
  // linha de um grupo de carretas: contagem por hora + total + % sobre as carretas do dia
  const linha = (cls, rotulo, cs, extra = "") =>
    `<tr class="${cls}"${extra}><td>${rotulo}</td>${horas.map(h => celula(cs.filter(c => horaDe(c) === h).length, cls !== "total")).join("")}` +
    `<td class="ini tot">${fmtInt(cs.length)}</td><td class="tot">${fmtPct(lista.length ? cs.length / lista.length : null)}</td></tr>`;
  const corpo = colunas.map((x, j) => {
    const cs = lista.filter(c => c.st === x.i), aberta = consolAbertas.has(x.st.nome);
    const rot = `<span class="seta">${aberta ? "▾" : "▸"}</span><span class="chip" style="background:${x.st.cor};color:${x.st.txt}">${x.st.nome}</span>` +
      (desde[j] ? `<span class="desde">${desde[j]}</span>` : "");
    let html = linha("expansivel", rot, cs, ` data-h="${x.st.nome}"`);
    if (aberta) {
      // transportadoras do status, da que tem mais carretas para a que tem menos
      const porTr = {};
      cs.forEach(c => (porTr[c.tr] = porTr[c.tr] || []).push(c));
      Object.entries(porTr).sort((u, v) => v[1].length - u[1].length)
        .forEach(([tr, ct]) => { html += linha("detalhe", tr, ct); });
    }
    return html;
  }).join("");
  const tab = $("tab-consol");
  tab.innerHTML = !lista.length ? `<tr><td class="muted" style="text-align:left;padding:12px 8px">Sem carretas para este dia.</td></tr>` :
    `<tr><th>Status atual</th>${horas.map(h => `<th class="${ROTULO_HORA[h] ? "fora" : ""}">${ROTULO_HORA[h] || h + "h"}</th>`).join("")}<th class="ini">Total</th><th>%</th></tr>` +
    corpo + linha("total", "Total carretas", lista);
  // destaque em cruz: ao passar o mouse, alem da linha, a coluna (status) da celula tambem fica cinza
  const limpar = () => tab.querySelectorAll(".col-hover").forEach(c => c.classList.remove("col-hover"));
  tab.onmouseover = ev => {
    const cel = ev.target.closest("td");
    limpar();
    if (!cel || cel.cellIndex < 1) return;
    [...tab.rows].forEach(tr => tr.cells[cel.cellIndex] && tr.cells[cel.cellIndex].classList.add("col-hover"));
  };
  tab.onmouseleave = limpar;
  tab.querySelectorAll("tr.expansivel").forEach(tr => tr.onclick = () => {
    const h = tr.dataset.h;
    consolAbertas.has(h) ? consolAbertas.delete(h) : consolAbertas.add(h);
    salvarEstado();
    renderMatrizConsolidacao(D.linhas);
  });
}

// ===== popup de divergencias: TUs sem tempo na etapa e as colunas da planilha que causaram =====
const fontesPopup = [];
// colunas da planilha (nome original da Sheet1) na ordem de I.datas
const DATAS_POPUP = ["FIM. FATURAMENTO", "CONF. PUXADA (ATS)", "ENT. PROT. NF", "FIM DE CONSOLIDAÇÃO",
  "CHEGADA DOCA", "INICIO DE CARREG.", "FIM DE CARREGAM.", "CHECKOUT", "JANELA DE EXPEDIÇÃO"];
const CHECKOUT = 7;
const fmtDataHora = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)} ${s.slice(11, 16)}` : "";
function abrirPopup(f, ev) {
  const etapa = f.e, [a, b] = etapa.datas;
  const tus = f.rs.filter(r => etapa.val(r) == null && String(r[I.motivo] || "")[etapa.p] === f.c)
    .sort((x, y) => (y[I.pedidos] || 0) - (x[I.pedidos] || 0));
  // motivo de cada TU e as colunas a corrigir
  const itens = tus.map(r => {
    const d = r[I.datas] || [];
    if (f.c === "1") return { r, d, motivo: "data não apontada", ruins: [a, b].filter(j => !d[j]) };
    // chegada x janela: chegar antes da janela e normal; so e invalida quando a chegada passa do checkout
    if (!etapa.soCheckout && d[b] < d[a]) return { r, d, motivo: "fim antes do início", ruins: [a, b] };
    return { r, d, motivo: "data depois do checkout",
      ruins: [a, b].filter(j => j !== CHECKOUT && j !== 8 && d[CHECKOUT] && d[j] > d[CHECKOUT]).concat([CHECKOUT]) };
  });
  // colunas mostradas: so as duas datas do calculo da etapa; o CHECKOUT entra so quando alguma TU
  // foi descartada pela regra "data depois do checkout" (ele e a referencia dessa regra)
  const usaCheckout = b !== CHECKOUT && itens.some(x => x.motivo === "data depois do checkout");
  const cols = usaCheckout ? [a, b, CHECKOUT] : [a, b];
  const linhas = itens.map(({ r, d, motivo, ruins }) =>
    `<tr><td>${r[I.tu] || "—"}</td><td>${r[I.tr]}</td><td>${fmtDia(r[I.dia])}</td><td>${fmtInt(r[I.pedidos] || 0)}</td>` +
      cols.map(j => `<td class="${ruins.includes(j) ? "ruim" : ""}">${d[j] ? fmtDataHora(d[j]) : "não apontada"}</td>`).join("") +
      `<td class="motivo">${motivo}</td></tr>`).join("");
  const pop = $("popup");
  pop.innerHTML = `<div class="pop-cab"><div><b>${etapa.nome}</b> · ${f.c === "1" ? "falta data" : "datas inválidas"} · ${f.rotulo}` +
    `<div class="muted">${fmtInt(tus.length)} TUs · ${fmtInt(tus.reduce((s, r) => s + (r[I.pedidos] || 0), 0))} pedidos · ` +
    `em vermelho as colunas da planilha a corrigir</div></div><button class="pop-fechar" aria-label="Fechar">×</button></div>` +
    `<div class="pop-corpo"><table><tr><th>TU</th><th>Transportadora</th><th>Expedição</th><th>Pedidos</th>` +
    cols.map(j => `<th>${DATAS_POPUP[j]}</th>`).join("") + `<th>Motivo</th></tr>${linhas}</table></div>`;
  // abre logo abaixo do numero clicado (o painel roda num quadro do Streamlit, sem tela fixa)
  pop.style.top = (ev.pageY + 12) + "px";
  pop.hidden = false;
  pop.querySelector(".pop-fechar").onclick = fecharPopup;
}
const fecharPopup = () => { $("popup").hidden = true; };
addEventListener("keydown", ev => { if (ev.key === "Escape") fecharPopup(); });
addEventListener("click", ev => { const p = $("popup"); if (!p.hidden && !p.contains(ev.target) && !ev.target.closest(".link-gap")) fecharPopup(); });

function renderPedidos(rows) {
  const por = {};
  rows.forEach(r => (por[r[I.dia]] = por[r[I.dia]] || []).push(r));
  const ds = Object.keys(por).sort();
  // o grafico nao abre por status TU: so 3 grupos (base -> topo) DHL, TRANSPORTE em andamento e EXPEDIDO
  const valores = ds.map(d => {
    const v = GRUPOS_GRAFICO.map(() => 0);
    por[d].forEach(r => v[grupoGrafico(r[I.status])] += r[I.pedidos] || 0);
    return v;
  });
  $("leg-pedidos").innerHTML = GRUPOS_GRAFICO
    .map(g => `<span><i class="dot" style="background:${g.cor}"></i>${g.nome}</span>`).join("");
  // altura do grafico = altura do cartao da tabela menos titulo/legenda do cartao do grafico,
  // para os dois cartoes terminarem alinhados (quando estao lado a lado)
  const cardTab = $("tab-status").closest(".card"), cardG = $("g-pedidos").closest(".card");
  const ladoALado = cardTab.offsetTop === cardG.offsetTop;
  const extra = cardG.offsetHeight - $("g-pedidos").offsetHeight;
  // grafico com pelo menos a altura da coluna de KPIs ao lado (para os dois terminarem juntos)
  const cabG = $("g-pedidos").offsetTop - $("g-pedidos").parentElement.offsetTop;  // titulo + legenda do grafico
  const H = ladoALado ? Math.max(240, cardTab.offsetHeight - extra) : Math.max(360, $("kpis-resp").offsetHeight - cabG);
  desenharEmpilhado($("g-pedidos"), ds, valores, {
    // numero e % do dia dentro de cada parte da barra (DHL, TRANSPORTE e EXPEDIDO), quando cabe
    H, series: GRUPOS_GRAFICO, pct: true, meses: true,
    // alerta nos dias ate hoje que ainda nao estao 100% expedidos (dias futuros ainda estao no planejamento)
    alerta: i => {
      const falta = valores[i][0] + valores[i][1];
      return ds[i] <= hoje && falta > 0 ? `⚠ ${fmtInt(falta)} não exp.` : null;
    },
    // tooltip do topo para a base, na mesma ordem visual da barra
    tt: i => `<b>${fmtDia(ds[i])}</b> · ${fmtInt(valores[i].reduce((s, x) => s + x, 0))} pedidos<br>` +
      GRUPOS_GRAFICO.map((g, j) => valores[i][j] > 0 ? `<i class="dot" style="background:${g.cor}"></i> ${g.nome}: ${fmtInt(valores[i][j])}` +
        ` (${fmtPct(valores[i][j] / valores[i].reduce((s, x) => s + x, 0))})` : "")
        .filter(Boolean).reverse().join("<br>"),
  });
}

// grupos do grafico: DHL (AG. PACOTE ate FATURADA), TRANSPORTE ainda em andamento (EM DOCA E FATURADA
// ate CAR. FINALIZADO) e EXPEDIDO; cores ligadas as do cabecalho da tabela (amarelo / cinza) e ao verde do EXPEDIDO
const GRUPOS_GRAFICO = [
  { nome: "DHL", cor: "#f2c14e", txt: "#fff" },
  { nome: "TRANSPORTE", cor: "#a9a79f", txt: "#fff" },
  { nome: "EXPEDIDO", cor: "#6dbb84", txt: "#fff" },
];
function grupoGrafico(status) {
  const st = STATUS[idxStatus(status)];
  if (st.nome === "EXPEDIDO") return 2;
  return st.resp === "DHL" ? 0 : 1;
}


// ===== transportadoras =====
const COLS_TR = [
  { nome: "Transportadora", v: g => g.tr, txt: g => g.tr },
  { nome: "TUs", v: g => g.n, txt: g => fmtInt(g.n) },
  ...SLAS.map((s, i) => ({ nome: "SLA " + s.curto, v: g => g.sla[i], txt: g => fmtPct(g.sla[i]), pior: "min" })),
  { nome: "Check-in → doca", v: g => g.checkin, txt: g => fmtMin(g.checkin), pior: "max" },
  { nome: "Espera carreg.", v: g => g.espera, txt: g => fmtMin(g.espera), pior: "max" },
  { nome: "Chegou antes consol.", v: g => g.antes, txt: g => fmtPct(g.antes) },
];
let ordem = { col: 1, asc: false };
function gruposTr(rows) {
  const por = {};
  rows.forEach(r => (por[r[I.tr]] = por[r[I.tr]] || []).push(r));
  return Object.entries(por).map(([tr, rs]) => {
    const a = tempos(rs, T_ANTES).length, d = tempos(rs, T_DEPOIS).length;
    return {
      tr, n: rs.length, sla: SLAS.map((_, i) => slaStats(rs, i).pct),
      checkin: quantil(tempos(rs, 8), .5), espera: quantil(tempos(rs, 9), .5), antes: a + d ? a / (a + d) : null,
    };
  });
}
function renderTr(rows) {
  const gs = gruposTr(rows);
  const elegiveis = gs.filter(g => g.n >= 20);
  const piores = COLS_TR.map(c => {
    if (!c.pior) return null;
    const vs = elegiveis.map(c.v).filter(v => v != null);
    return vs.length > 1 ? (c.pior === "min" ? Math.min(...vs) : Math.max(...vs)) : null;
  });
  const c = COLS_TR[ordem.col];
  gs.sort((a, b) => {
    const va = c.v(a), vb = c.v(b);
    if (va == null) return 1; if (vb == null) return -1;
    return (va < vb ? -1 : va > vb ? 1 : 0) * (ordem.asc ? 1 : -1);
  });
  $("tab-tr").innerHTML = `<tr>${COLS_TR.map((cc, j) => `<th data-j="${j}" class="${j === ordem.col ? "ord" + (ordem.asc ? " asc" : "") : ""}">${cc.nome}</th>`).join("")}</tr>` +
    gs.map(g => `<tr>${COLS_TR.map((cc, j) => {
      const pior = piores[j] != null && g.n >= 20 && cc.v(g) === piores[j];
      return `<td class="${pior ? "pior" : ""}">${pior ? "▼ " : ""}${cc.txt(g)}</td>`;
    }).join("")}</tr>`).join("");
  $("tab-tr").querySelectorAll("th").forEach(th => th.onclick = () => {
    const j = +th.dataset.j;
    ordem = { col: j, asc: ordem.col === j ? !ordem.asc : j === 0 };
    renderTr(filtrar());
  });
}

// ===== orquestracao =====
// por enquanto o painel mostra so o bloco de pedidos; renderEtapas, renderProcessos e renderTr
// ficam disponiveis para voltar com os outros blocos (precisam do HTML correspondente)
function render() {
  let rows = filtrar();
  // renderTabelaTempos e renderTabelaSlas ficam disponiveis, mas as tabelas foram retiradas da visao
  // a tabela primeiro: ela define a largura que sobra para o grafico
  // o filtro de dia vale so para a tabela; o grafico mostra sempre todos os dias
  // historico = D-1: so dias de expedicao ate ontem (hoje e futuros ainda estao em andamento)
  // o filtro de dia e os KPIs funcionam normal; o D-1 vale so para a tabela do historico
  renderKpis(rows);
  if (ehHist()) {
    const porData = modo === "hist-dia";
    $("tit-status").textContent = `Histórico dos tempos médios por ${porData ? "data" : "transportadora"} (D-1)`;
    $("sub-status").textContent = "";
    renderTabelaHistorico(filtrarHistorico(rows));
  } else {
    $("tit-status").textContent = "Pedidos por status TU e responsável";
    $("sub-status").textContent = "Tempo médio da etapa: só nos status de transporte";
    renderTabelaStatus(rows);
  }
  $("f-modo").querySelectorAll("button").forEach(b => b.classList.toggle("ativo", b.dataset.m === modo));
  renderPedidos(D.linhas);
  // matriz do dia escolhido no filtro (sem filtro: hoje)
  renderMatrizConsolidacao(D.linhas);
}

// ===== estado da tela (modo, dia e linhas abertas) =====
// os dados sao atualizados a cada 2 min e a pagina e redesenhada; o estado salvo no navegador faz a
// tela voltar como estava. Vale por 30 min: depois disso abre de novo no dia atual, em tempo real
let modo = "real";
const CHAVE_ESTADO = "painel-drive-estado";
function salvarEstado() {
  try {
    localStorage.setItem(CHAVE_ESTADO, JSON.stringify({
      t: Date.now(), modo, dia: selDia.value, status: [...statusAbertos], hist: [...histAbertos], consol: [...consolAbertas],
    }));
  } catch (e) { /* navegador sem armazenamento: segue sem lembrar */ }
}
try {
  const e = JSON.parse(localStorage.getItem(CHAVE_ESTADO) || "null");
  if (e && Date.now() - e.t < 30 * 60 * 1000) {
    modo = ["real", "hist-dia", "hist-tr"].includes(e.modo) ? e.modo : "real";
    if ([...selDia.options].some(o => o.value === e.dia) && !(ehHist() && e.dia >= hoje)) selDia.value = e.dia;
    else if (ehHist()) selDia.value = "";
    (e.status || []).forEach(s => statusAbertos.add(s));
    (e.hist || []).forEach(s => histAbertos.add(s));
    (e.consol || []).forEach(s => consolAbertas.add(s));
  }
} catch (e) { /* estado invalido ou indisponivel: comeca do padrao */ }

selDia.onchange = () => { salvarEstado(); render(); };
// ao entrar no historico vindo do tempo real: todos os dias (para comparar); entre os dois historicos o dia
// escolhido e mantido; ao voltar para o tempo real: dia atual
$("f-modo").querySelectorAll("button").forEach(b => b.onclick = () => {
  if (b.dataset.m === modo) return;
  const eraHist = ehHist();
  modo = b.dataset.m;
  if (!ehHist()) selDia.value = diaInicial || "";
  else if (!eraHist) selDia.value = "";
  salvarEstado(); render();
});
$("f-limpar").onclick = () => { selDia.value = ""; salvarEstado(); render(); };
let tempoResize;
addEventListener("resize", () => { clearTimeout(tempoResize); tempoResize = setTimeout(render, 150); });
render();
</script>
</body>
</html>
